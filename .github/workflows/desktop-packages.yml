name: Desktop packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  package:
    name: package (${{ matrix.pack_id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Official releases currently support the Windows modeling backend.
        # Manual runs retain cross-platform packaging diagnostics.
        include: ${{ fromJSON(github.event_name == 'push' && '[{"pack_id":"windows","runner":"windows-latest","dist_script":"dist"}]' || '[{"pack_id":"windows","runner":"windows-latest","dist_script":"dist"},{"pack_id":"linux","runner":"ubuntu-latest","dist_script":"dist"},{"pack_id":"macos","runner":"macos-latest","dist_script":"dist:mac"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v${version}" ]; then
            echo "tag ${tag} does not match package.json version v${version}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Linux packaging tools
        if: matrix.pack_id == 'linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Download managed Windows runtime
        if: matrix.pack_id == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download runtime-windows-1.0.0-adjusttext --pattern "hajimi-runtime-1.0.0-local-test.20260909-adjusttext-win32-x64.tar.gz" --dir runtime/windows/payloads

      - name: Download bundled draw.io
        if: matrix.pack_id == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v28.2.5 --repo jgraph/drawio-desktop --pattern "draw.io-28.2.5-windows.zip" --dir runtime/windows
          if ($LASTEXITCODE -ne 0) { throw "draw.io download failed" }
          $archive = "runtime/windows/draw.io-28.2.5-windows.zip"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "9e40f32765f87c443fce9259e9d0c51eb555b6a733aa929bc5a22b7e1ead4aee") { throw "draw.io checksum mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath runtime/windows/drawio
          if (!(Test-Path runtime/windows/drawio/draw.io.exe)) { throw "draw.io executable missing" }

      - name: Populate original workflow runtime binaries
        if: matrix.pack_id == 'windows'
        shell: pwsh
        run: |
          Copy-Item -LiteralPath runtime/windows/payloads -Destination compatibility/v010/runtime/windows -Recurse -Force
          Copy-Item -LiteralPath runtime/windows/drawio -Destination compatibility/v010/runtime/windows -Recurse -Force

      - name: Build installer
        env:
          HAJIMI_OFFLINE_RUNTIME: ${{ matrix.pack_id == 'windows' && '1' || '0' }}
        run: npm run ${{ matrix.dist_script }}

      - name: Verify Linux deb
        if: matrix.pack_id == 'linux'
        run: dpkg-deb -I release/*.deb

      - name: Verify macOS universal artifacts
        if: matrix.pack_id == 'macos'
        run: |
          hdiutil verify release/*.dmg
          unzip -t release/*-mac-universal.zip
          archs="$(lipo -archs "release/mac-universal/HaJiMi.app/Contents/MacOS/HaJiMi")"
          echo "lipo archs: ${archs}"
          echo "${archs}" | grep -q "x86_64"
          echo "${archs}" | grep -q "arm64"

      - name: Upload Windows artifacts
        if: matrix.pack_id == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          if-no-files-found: error
          path: |
            release/HaJiMi-Setup-*.exe
            release/HaJiMi-Setup-*.exe.blockmap
            release/latest.yml

      - name: Upload Linux artifacts
        if: matrix.pack_id == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          if-no-files-found: error
          path: |
            release/HaJiMi-*-linux-*.deb
            release/latest-linux.yml

      - name: Upload macOS artifacts
        if: matrix.pack_id == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          if-no-files-found: error
          path: |
            release/HaJiMi-*-mac-universal.dmg
            release/HaJiMi-*-mac-universal.dmg.blockmap
            release/HaJiMi-*-mac-universal.zip
            release/HaJiMi-*-mac-universal.zip.blockmap
            release/latest-mac.yml

  publish:
    name: upload GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-windows
          path: dist-artifacts
          merge-multiple: true

      - name: Publish assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag}.md"
          shopt -s nullglob
          assets=(
            dist-artifacts/HaJiMi-Setup-*.exe
            dist-artifacts/HaJiMi-Setup-*.exe.blockmap
            dist-artifacts/latest.yml
          )
          if [ "${#assets[@]}" -ne 3 ]; then
            echo "expected 3 Windows release assets, found ${#assets[@]}:"
            printf '%s\n' "${assets[@]}"
            ls -la dist-artifacts
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists"
          elif [ -f "$notes" ]; then
            gh release create "$tag" --title "HaJiMi ${tag}" --notes-file "$notes" --verify-tag
          else
            gh release create "$tag" --title "HaJiMi ${tag}" --generate-notes --verify-tag
          fi
          gh release upload "$tag" "${assets[@]}" --clobber
          gh release edit "$tag" --draft=false
